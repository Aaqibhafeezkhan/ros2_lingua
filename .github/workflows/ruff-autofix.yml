name: Apply Ruff fixes

on:
  push:
    branches: [fix/issue-47-ci-quality]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  autofix:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-47-ci-quality
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Ruff
        run: python -m pip install --upgrade ruff
      - name: Apply lint and formatting fixes
        run: |
          ruff check --fix examples/ ros2_lingua/ ros2_lingua_core/ ros2_lingua_mock/
          ruff format examples/ ros2_lingua/ ros2_lingua_core/ ros2_lingua_mock/
      - name: Commit fixes
        run: |
          if git diff --quiet; then
            echo "No Ruff fixes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add examples/ ros2_lingua/ ros2_lingua_core/ ros2_lingua_mock/
          git commit -m "style: apply Ruff lint and formatting fixes"
          git push
